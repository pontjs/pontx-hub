slug: stripe
name: Stripe API
provider: Stripe
category: Payments
featured: true
sourceUrl: https://raw.githubusercontent.com/stripe/openapi/master/openapi/spec3.json
license: Apache-2.0
attributionUrl: https://github.com/stripe/openapi
approvedSha256: pending
title:
  zh: Stripe API
  en: Stripe API
summary:
  zh: 使用类型安全的 SDK 查询账户余额，并构建支付与订阅工作流。
  en: Query balances and build payment or subscription workflows with a type-safe SDK.
accent: "#635bff"
packageName: "@pontx/api-stripe"
sdkVersion: 0.1.0
proxyEnabled: true
servers:
  - id: production
    url: https://api.stripe.com
    description:
      zh: Stripe API
      en: Stripe API
auth:
  - id: bearer
    type: bearer
    envVar: STRIPE_SECRET_KEY
    description:
      zh: Stripe 测试或生产环境 Secret Key
      en: Stripe test or live Secret Key
operations:
  - slug: get-balance
    operationId: GetBalance
    tag: Balance
    method: GET
    path: /v1/balance
    title:
      zh: 获取账户余额
      en: Retrieve balance
    description:
      zh: 查询当前 Stripe 账户的可用和待结算余额。
      en: Retrieve available and pending balances for the current Stripe account.
    parameters: []
    responseExample:
      object: balance
      available: []
      pending: []
  - slug: create-payment-intent
    operationId: PostPaymentIntents
    tag: Payment Intents
    method: POST
    path: /v1/payment_intents
    title:
      zh: 创建 PaymentIntent
      en: Create a PaymentIntent
    description:
      zh: 创建支付意图；执行会产生服务端状态，必须二次确认。
      en: Create a payment intent; execution changes server state and requires confirmation.
    contentType: application/x-www-form-urlencoded
    parameters:
      - name: body
        in: body
        required: true
        type: object
        example:
          amount: 2000
          currency: usd
    responseExample:
      id: pi_example
      object: payment_intent
      amount: 2000
      currency: usd
