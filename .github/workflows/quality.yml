name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The hierarchy loader accepts only an immutable metadata revision. Keep
      # CI on the reviewed hierarchy commit rather than a drifting branch URL.
      METADATA_REPO_COMMIT: 998b46a642111f20380102f744954d6875fd9557
      METADATA_REPO_LOCAL_PATH: ${{ github.workspace }}/.metadata-source
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned metadata hierarchy
        uses: actions/checkout@v4
        with:
          repository: pontjs/pontx-api-metadata
          ref: ${{ env.METADATA_REPO_COMMIT }}
          path: .metadata-source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm search:eval
      - run: pnpm build
      - run: pnpm sdk:verify
