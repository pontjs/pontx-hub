name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The hierarchy loader accepts only an immutable metadata revision. Keep
      # CI on the reviewed hierarchy commit rather than a drifting branch URL.
      METADATA_REPO_COMMIT: a9cfcd7e19613845905fc028a0ef9eb8550a4981
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm search:eval
      - run: pnpm build
      - run: pnpm sdk:verify
